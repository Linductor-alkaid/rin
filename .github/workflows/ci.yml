name: ci

# push 到任意分支触发构建/测试；package job 在 ubuntu 20.04 容器内产出
# focal 兼容的 deb 工件（v0.3.0 起）；v* tag 触发将 deb 附着到 GitHub Release。
on:
  push:
    branches: ["**"]
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build & test (${{ matrix.preset }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # tsan 预设需 setarch -R 旁路本机 ASLR 限制，不进 CI 矩阵（见 CHANGELOG 已知限制）。
        preset: [debug, asan, ubsan]
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain and dev packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache pkg-config \
            libusb-1.0-0-dev libudev-dev libcurl4-openssl-dev \
            libgl1-mesa-dev libegl-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libxkbcommon-dev libwayland-dev wayland-protocols

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ matrix.preset }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.preset }}-

      - name: Configure
        run: >-
          cmake --preset ${{ matrix.preset }}
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build/${{ matrix.preset }}

      - name: Test
        run: ctest --test-dir build/${{ matrix.preset }} --output-on-failure

  package:
    # 20.04 (focal) 适配（v0.3.0 起）：deb 在 focal 容器内构建——产物按 focal 的
    # glibc 2.31 链接、shlibs 依赖按 focal 计算并随 Release 分发；在更新的宿主上
    # 构建的产物无法在 focal 运行。executor 公开头使用 concepts/requires 表达式
    # （最低 GCC 10），focal 默认 g++-9 不可用，显式用 universe 的 g++-10；focal
    # 系统 CMake 为 3.16（低于项目要求的 3.25），经 pip 安装新版 cmake/ninja。
    name: deb package (ubuntu 20.04)
    runs-on: ubuntu-24.04
    container: ubuntu:20.04
    needs: test
    steps:
      - name: Install toolchain and dev packages (focal)
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential g++-10 git ca-certificates pkg-config python3-pip \
            libusb-1.0-0-dev libudev-dev libcurl4-openssl-dev \
            libgl1-mesa-dev libegl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libxkbcommon-dev libwayland-dev wayland-protocols
          python3 -m pip install --upgrade "cmake>=3.25,<4" ninja
          cmake --version
          g++-10 --version

      - uses: actions/checkout@v4

      - name: Configure (release, GCC 10, no tests)
        run: CXX=g++-10 CC=gcc-10 cmake --preset release -DRIN_BUILD_TESTS=OFF

      - name: Build
        run: cmake --build build/release

      - name: Package (deb)
        run: cmake --build build/release --target package

      - name: Verify package
        run: |
          dpkg-deb -I build/release/dist/*.deb
          dpkg-deb -c build/release/dist/*.deb
          rm -rf /tmp/rin-deb-check
          dpkg-deb -x build/release/dist/*.deb /tmp/rin-deb-check
          readelf -d /tmp/rin-deb-check/usr/bin/rin | grep -F 'Library runpath: [$ORIGIN/../lib/rin]'
          find /tmp/rin-deb-check/usr/lib/rin -name 'librealsense2.so.*' | grep -q .
          test -f /tmp/rin-deb-check/usr/lib/udev/rules.d/99-realsense-libusb.rules
          test -f /tmp/rin-deb-check/usr/share/applications/rin.desktop
          test -f /tmp/rin-deb-check/usr/share/icons/hicolor/512x512/apps/rin.png
          ldd /tmp/rin-deb-check/usr/bin/rin | grep -F 'lib/rin/librealsense2'
          if ldd /tmp/rin-deb-check/usr/bin/rin 2>/dev/null | grep -q "not found"; then
            ldd /tmp/rin-deb-check/usr/bin/rin
            exit 1
          fi
          # focal 兼容性护栏：运行库 glibc 版本要求不得超过 focal 的 2.31。
          required_glibc="$(objdump -T /tmp/rin-deb-check/usr/bin/rin | grep -o 'GLIBC_2\.[0-9]*' | sort -u -V | tail -1)"
          echo "required ${required_glibc}"
          [ "$(printf 'GLIBC_2.31\n%s\n' "${required_glibc}" | sort -V | tail -1)" = "GLIBC_2.31" ]

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: rin-deb
          path: build/release/dist/*.deb
          if-no-files-found: error

  release:
    # 容器 job 内无 gh CLI：发布附着在宿主 runner 上完成（v* tag 触发）。
    name: attach deb to GitHub Release
    runs-on: ubuntu-24.04
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download deb artifact
        uses: actions/download-artifact@v4
        with:
          name: rin-deb
          path: dist

      - name: Attach deb to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            dist/*.deb ||
          gh release upload "$GITHUB_REF_NAME" --clobber dist/*.deb
